<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OCI Vision Studio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/htmx-2.0.0.min.js"></script>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="shell header-inner">
            <a href="/" class="brand">
                <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <span>OCI Vision Studio</span>
            </a>
            <nav class="site-nav" aria-label="Sections">
                <a href="/" class="nav-link{% if request.url.path == '/' %} active{% endif %}">Analyzer</a>
                <a href="/gallery" class="nav-link{% if request.url.path == '/gallery' %} active{% endif %}">Gallery</a>
                <a href="/compare" class="nav-link{% if request.url.path == '/compare' %} active{% endif %}">Compare</a>
                <a href="/showcase" class="nav-link{% if request.url.path == '/showcase' %} active{% endif %}">Showcase</a>
                {% if demo %}<span class="demo-note">demo · cached responses</span>{% endif %}
            </nav>
        </div>
    </header>

    <main class="shell main">
        {% block content %}{% endblock %}
    </main>

    <footer class="shell site-footer">
        <span>OCI Vision Studio</span>
        <span class="mono">Oracle Cloud Vision AI</span>
    </footer>

    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
